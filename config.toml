# Times are in milliseconds unless the name ends in _s (seconds).

[server]
http_port = 8080
udp_port = 5005
tick_hz = 60

# Changing the settings will not wipe learning: learners store counts, costs apply at choice time.
[costs]
version = "costs-v1"
tier0 = 1.0
tier1 = 2.0
tier2 = 4.0
tier3 = 8.0

[reward]
give_up = -0.5
blocked = 0.15          # times the tier's cost
time_penalty = 0.6      # per second of dwell, on a worked look
effort_base = 0.35      # signal effort = base + per_s * usual seconds
effort_per_s = 0.25
effort_start_s = 1.2

# Windows for reading what happened.
[windows]
undo_s = 5.0
backspace_s = 3.0
give_up_min_fill = 0.5      # an unfilled look counts as a give-up only if it got this far
give_up_confirm_s = 5.0     # and the same button was chosen within this many seconds after it
come_back_signal_s = 3.0

# Dwell learner (tiers 0 and 1 only).
[dwell]
start = 1500            # a careful start; the learner shortens it as it learns the person
min = 800               # never shorter than this, however well things go
max = 2000
step = 25
warmup_selections = 20  # selections (not glances) at the starting dwell before learning moves it
smoothing = 0.05        # move 5% of the way towards the learner's pick, once per selection
max_step_down = 10      # going shorter: at most 10 ms per selection (under 1%), so it stays high for long
max_step_up = 100       # going longer: up to 100 ms per selection, so accidents are fixed quickly
borrow_looks = 30
high_tier = 1000        # fixed dwell before the signal step on tiers 2 and 3
undo = 800              # undo strip, fixed, never learned
fixed_condition = 1250  # dwell everywhere in the Fixed study condition

# Modality Router.
[router]
borrow_tries = 20
preferred_bonus = 2

# From a look to an action.
[interaction]
margin_px = 12
switch_ms = 100
look_end_ms = 150
min_look_ms = 100
drain_speed = 2.0
wait_s = 4.0
cancel_wait_ms = 500
pause_ms = 600
lost_ms = 300

# Signals.
[signals]
closed_level = 0.5
raised_level = 0.5
blink_hold_ms = 500
brow_hold_ms = 300
attempt_min_ms = 150
yes_debounce_s = 1.5
escape_presses = 3
escape_window_s = 2.0
switch_keys = [" ", "Enter", "s", "S"]
check_tries = 3
check_try_s = 6.0
check_relax_s = 2.0

# Gaze.
[gaze]
smoothing_alpha = 0.3
drift_rate = 0.1
drift_cap_px = 80
drift_window_ms = 300
calib_settle_s = 1.2
calib_collect_s = 1.0
calib_redo_px = 100
mouse_noise_px = 0

# Context and Tracking quality.
[context]
tired_minutes = 20
tired_hour = 18
slip_count = 2
slip_window = 6
shaky_ratio = 1.5
shaky_looks = 20
baseline_spread_px = 20
tracking_window_s = 5.0
poor_fraction = 0.1         # tracking counts as poor above this share of lost frames
poor_recover_fraction = 0.05  # and good again only below this, so it does not flicker
banner_hold_s = 1.0         # a banner shows or clears only after its reason has held this long
min_dist = 0.30
max_dist = 0.70

[chat]
reply_after_s = 7.0     # longer than the undo window, so a reply never follows an unsent message
call_connect_s = 3.0
