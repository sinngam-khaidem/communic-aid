name: GazeStreamer
options:
  bundleIdPrefix: com.sinngam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  GazeStreamer:
    type: application
    platform: iOS
    sources:
      - path: GazeStreamer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sinngam.gazestreamer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3YBN47K9XT
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "The TrueDepth camera is used to estimate where you are looking."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Gaze data is sent to the Mac on your local network."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "The microphone listens for the word go. Audio never leaves the phone."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech is recognised on this phone to hear the word go."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
