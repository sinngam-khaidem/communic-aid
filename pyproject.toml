[project]
name = "communicaid"
version = "0.1.0"
description = "Communic-aid: gaze and multimodal chat prototype with adaptive confirmation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["communicaid"]

[tool.setuptools.package-data]
communicaid = ["chats.json", "words.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
